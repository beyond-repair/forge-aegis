name: forge-aegis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (validator + pipeline)
        run: |
          python python/tests/test_validator.py
          python python/tests/test_pipeline.py

      - name: CLI smoke (PASS path)
        run: |
          set -e
          export TMP=$(mktemp -d)
          mkdir -p "$TMP/host"
          echo alpha > "$TMP/host/a.txt"
          echo beta > "$TMP/host/b.txt"
          python - <<'PY'
          import hashlib, json, os, pathlib
          host = pathlib.Path(os.environ["TMP"]) / "host"
          arts = []
          for p in sorted(host.rglob("*")):
              if p.is_file():
                  dig = hashlib.sha256(p.read_bytes()).hexdigest()
                  arts.append({
                      "id": str(p.relative_to(host)).replace("\\", "/"),
                      "kind": "file",
                      "digest": dig,
                  })
          policy = {"schema": "aegis.fls.v0.1", "baseline_id": "ci", "artifacts": arts}
          (pathlib.Path(os.environ["TMP"]) / "policy.json").write_text(json.dumps(policy))
          print("policy written", len(arts))
          PY
          python python/aegis_pipeline.py --host "$TMP/host" --policy "$TMP/policy.json" --audit-dir "$TMP/audit"
          test -d "$TMP/audit"

      - name: CLI smoke (FAIL / tamper)
        run: |
          set -e
          TMP=$(mktemp -d)
          mkdir -p "$TMP/host"
          echo alpha > "$TMP/host/a.txt"
          DIG=$(sha256sum "$TMP/host/a.txt" | awk '{print $1}')
          printf '%s\n' "{\"schema\":\"aegis.fls.v0.1\",\"baseline_id\":\"ci-fail\",\"artifacts\":[{\"id\":\"a.txt\",\"kind\":\"file\",\"digest\":\"$DIG\"}]}" > "$TMP/policy.json"
          echo TAMPERED > "$TMP/host/a.txt"
          set +e
          python python/aegis_pipeline.py --host "$TMP/host" --policy "$TMP/policy.json" --audit-dir "$TMP/audit"
          code=$?
          set -e
          test "$code" -eq 2
